# AIDE policy for the AI Stack scan target.
# The scan target is bind-mounted read-only at /scan-target; all rules are
# deliberately restricted to paths underneath it. Do not widen the scope
# to host absolute paths - they are not visible inside the job container.

database_in=file:/var/lib/aide/aide.db.gz
database_out=file:/var/lib/aide/aide.db.gz
gzip_dbout=yes

# Attributes to monitor: permissions, inode, links, uid/gid, size, mtime,
# and hashes. sha256 replaces the default sha256+sha512 mix for speed;
# increase if stronger assurance is required.
PERMS = p+i+l+u+g+s+m+sha256

/scan-target   PERMS
