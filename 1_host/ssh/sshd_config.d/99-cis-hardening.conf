# CIS-aligned sshd hardening drop-in for the FCOS/Secureblue host.
#
# Install (first-obtained value wins, so drop-ins override sshd_config):
#   run0 install -d -m 0755 /etc/ssh/sshd_config.d
#   run0 install -m 0644 99-cis-hardening.conf /etc/ssh/sshd_config.d/
#   run0 install -m 0644 issue.net /etc/issue.net   # if Banner is enabled
#   sudo sshd -t                                  # validate syntax
#   sudo systemctl reload sshd                    # apply without dropping sessions
#
# Keep a working local/console session open while testing. Verify key-based
# login from a second host BEFORE disabling PasswordAuthentication on a
# headless box, or you can lock yourself out.

# --- Protocol and crypto -------------------------------------------------
Protocol 2
# CIS: AES-GCM/CTR only; ChaCha20 and CBC/3DES/RC4/arcfour are excluded.
Ciphers aes256-gcm@openssh.com,aes128-gcm@openssh.com,aes256-ctr,aes192-ctr,aes128-ctr
MACs hmac-sha2-512,hmac-sha2-256
KexAlgorithms ecdh-sha2-nistp521,ecdh-sha2-nistp384,ecdh-sha2-nistp256,diffie-hellman-group-exchange-sha256

# --- Authentication ------------------------------------------------------
LoginGraceTime 60
MaxAuthTries 4
PermitRootLogin no
PermitEmptyPasswords no
# CIS recommends key-only auth. Set to 'yes' only if password auth is
# deliberately required; prefer 'prohibit-password' for break-glass access.
PasswordAuthentication no
PubkeyAuthentication yes
# Kerberos/GSSAPI is left at distro defaults; disable if unused:
# GSSAPIAuthentication no

# --- Session and forwarding controls -------------------------------------
MaxSessions 4
ClientAliveInterval 300
ClientAliveCountMax 2
X11Forwarding no
# CIS-aligned defaults; relax only if a documented workflow needs them.
AllowAgentForwarding no
AllowTcpForwarding no
PermitTunnel no
GatewayPorts no
PermitUserEnvironment no
PermitUserRC no
HostbasedAuthentication no
IgnoreRhosts yes
LogLevel VERBOSE

# --- Optional legal banner ------------------------------------------------
# Uncomment after installing issue.net to /etc/issue.net:
# Banner /etc/issue.net

# SFTP: keep the distro default subsystem. To force internal-sftp only:
# Subsystem sftp internal-sftp
